<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>New User</title>
  <style>
    * {
      box-sizing: border-box;
      font-family: sans-serif;
    }

    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
    }

    h1 {
      font-family: serif;
      border: 1px solid #000;
      padding: 15px 80px;
      margin-bottom: 30px;
    }

    form {
      display: grid;
      grid-template-columns: 160px 260px;
      gap: 12px;
    }

    label {
      background-color: lightyellow;
      border: 1px solid #000;
      border-radius: 5px;
      padding: 6px;
      text-align: center;
    }

    input {
      border: 1px solid #000;
      padding: 6px;
      text-align: center;
    }

    button {
      margin-top: 25px;
      padding: 18px 65px;
      font-size: 18px;
      border: 1px solid #000;
      background-color: royalblue;
      color: white;
    }

    footer {
      position: fixed;
      bottom: 0;
      left: 0;
      border-top: 1px solid #000;
      border-right: 1px solid #000;
      padding: 10px 15px;
    }
  </style>
</head>
<body>
  <h1>User Sign Up</h1>

  <form>
    <label>Full Name</label>
    <input type="text">

    <label>Age</label>
    <input type="text">

    <label>Gender</label>
    <input type="text">

    <label>Email</label>
    <input type="email">

    <label>Password</label>
    <input type="password">

    <label>Confirm Password</label>
    <input type="password">
  </form>

  <button type="submit">Sign Up</button>

  <footer>
    Date: October 14th, 2026<br>
    Time: 8:40 PM
  </footer>
</body>
</html>
