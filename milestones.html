<!DOCTYPE html>
<html lang="en">
<head> <!-- head section -->
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MindBloom | Milestones</title>
  <link rel="stylesheet" href="styles.css">
</head> <!-- head section -->
<body>
  <main> <!-- webpage content starts here -->
    <h1 id="page-title">Milestones Page</h1>
    <div class="milestone"> <!-- mindseed achievement -->
      <h2>Mindseed</h2>
      <p>Complete your first daily questionnaire!</p>
      <p class="status complete">Status: Complete!</p>
    </div>
    <div class="milestone"> <!-- mindbud achievement -->
      <h2>Mindbud</h2>
      <p>Reach a Daily Questionnaire Streak of 5 days!</p>
      <p class="status locked">Status: Not Yet Unlocked.</p>
    </div>
    <div class="milestone"> <!-- scribe of thoughts achievement -->
      <h2>Scribe of Thoughts</h2>
      <p>Write in your journal!</p>
      <p class="status locked">Status: Not Yet Unlocked.</p>
    </div>
    <div class="milestone"> <!-- focus achievement -->
      <h2>Focused</h2>
      <p>Enter Focus Mode!</p>
      <p class="status locked">Status: Not Yet Unlocked.</p>
    </div>
  </main> <!-- webpage content ends here -->
</body>
</html>
