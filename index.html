<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Home</title>
  <style>
    * {
      font-family: sans-serif;
      margin: 0;
      padding: 0;
      user-select: none;
      text-decoration: none;
      color: black;
    }

    .main {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      row-gap: 100px;
      column-gap: 50px;
      min-height: 100vh;
      align-content: center;
    }

    .grid-item {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
    }

    .emoji {
      font-size: 5rem;
      margin-bottom: 30px;
    }
  </style>
</head>
<body>
  <div class="main">
    <div class="grid-item">
      <p class="emoji">📜️</p>
      <p>Journal</p>
    </div>
    <a href="/log_history">
      <div class="grid-item">
        <p class="emoji">🕒️</p>
        <p>Log History</p>
      </div>
    </a>
    <div class="grid-item">
      <p class="emoji">⚙️</p>
      <p>Settings</p>
    </div>
    <div class="grid-item">
      <p class="emoji">📈️</p>
      <p>Milestones</p>
    </div>
    <div class="grid-item">
      <p class="emoji">🛠️</p>
      <p>App UI Customization</p>
    </div>
    <div class="grid-item">
      <p class="emoji">📋️</p>
      <p>Daily Questionnaire</p>
    </div>
  </div>
</body>
</html>
